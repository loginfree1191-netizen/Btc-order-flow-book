<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTC Orderbook — LIVE Whales > 3 BTC</title>
<style>
  :root{
    --bg:#0b0e11; --panel:#161a1e; --border:#2b3139;
    --green:#0ecb81; --red:#f6465d; --text:#eaecef; --muted:#848e9c;
    --whale:#f0b90b;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
  body{background:var(--bg);color:var(--text);display:flex;justify-content:center;padding:10px}
  .wrap{width:100%;max-width:460px}

  .header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .title{font-size:18px;font-weight:700}
  .price{font-size:20px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums;transition:color .15s}
  .sub{font-size:10px;color:var(--muted)}

  /* ===== TRADINGVIEW CHART ===== */
  .tv-wrap{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:8px;
    padding:0;
    margin-bottom:8px;
    overflow:hidden;
    height:220px;
  }
  .tv-wrap .tradingview-widget-container{ height:100%; }
  .tv-wrap .tradingview-widget-container__widget{ height:calc(100% - 22px); }
  .tv-wrap .tradingview-widget-copyright{
    font-size:9px !important; line-height:22px; text-align:center; color:var(--muted) !important;
  }
  .tv-wrap .tradingview-widget-copyright a{ color:var(--muted) !important; text-decoration:none; }

  /* ===== TOAST — FROM BELOW ===== */
  .toast-wrap{
    position:fixed; bottom:10px; left:50%; transform:translateX(-50%);
    width:calc(100% - 20px); max-width:460px;
    z-index:100; display:flex; flex-direction:column-reverse; gap:6px;
    pointer-events:none;
  }
  .toast{
    background:rgba(30,35,41,.97);
    border:1px solid var(--whale);
    border-left:4px solid var(--whale);
    border-radius:8px;
    padding:8px 12px;
    font-size:11.5px;
    color:var(--text);
    display:flex; align-items:center; gap:8px;
    box-shadow:0 6px 24px rgba(0,0,0,.5);
    animation: toast-in .35s cubic-bezier(.2,.9,.3,1.4), toast-out .4s ease-in 2.6s forwards;
    pointer-events:auto;
  }
  .toast.ask  { border-color:var(--red);   border-left-color:var(--red);   background:rgba(50,20,25,.97); }
  .toast.bid  { border-color:var(--green); border-left-color:var(--green); background:rgba(15,45,32,.97); }
  .toast .icon{ font-size:14px; }
  .toast .body{ flex:1; line-height:1.35; }
  .toast .p{ font-weight:700; font-variant-numeric:tabular-nums; }
  .toast.ask  .p{ color:var(--red); }
  .toast.bid  .p{ color:var(--green); }
  .toast .s{ color:var(--muted); font-size:10px; }
  .toast .qty{ font-weight:700; color:var(--whale); font-variant-numeric:tabular-nums; }

  @keyframes toast-in  { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
  @keyframes toast-out { from{opacity:1;transform:translateY(0)}     to{opacity:0;transform:translateY(10px)} }

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .row{display:grid;grid-template-columns:1.15fr 1fr .85fr;padding:5px 10px;font-size:11.5px;position:relative;align-items:center;will-change:contents}
  .row.head{color:var(--muted);border-bottom:1px solid var(--border);font-size:9.5px;text-transform:uppercase}
  .row .bar{position:absolute;top:0;bottom:0;right:0;opacity:.13;will-change:width}
  .ask .bar{background:var(--red)}
  .bid .bar{background:var(--green)}
  .ask .p{color:var(--red)}
  .bid .p{color:var(--green)}
  .amt,.tot{text-align:right;font-variant-numeric:tabular-nums}
  .mid{padding:6px 10px;text-align:center;font-weight:700;font-size:13px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:#1e2329;font-variant-numeric:tabular-nums}

  .row.big{
    background:rgba(240,185,11,.13);
    border-left:3px solid var(--whale);
    padding-left:7px;
  }
  .row.big .p{font-weight:700;color:var(--whale)}
  .row.big .amt,.row.big .tot{color:var(--whale);font-weight:600}
  .row.big .bar{opacity:.30}

  @keyframes flash-new {
    0%   { background: rgba(14,203,129,.55); box-shadow: inset 0 0 0 1px rgba(14,203,129,.9); }
    40%  { background: rgba(14,203,129,.28); box-shadow: inset 0 0 0 1px rgba(14,203,129,.5); }
    100% { background: rgba(240,185,11,.13); box-shadow: none; }
  }
  @keyframes flash-grow {
    0%   { background: rgba(240,185,11,.55); box-shadow: inset 0 0 0 1px rgba(240,185,11,.95); }
    40%  { background: rgba(240,185,11,.30); box-shadow: inset 0 0 0 1px rgba(240,185,11,.5); }
    100% { background: rgba(240,185,11,.13); box-shadow: none; }
  }
  @keyframes flash-shrink {
    0%   { background: rgba(246,70,93,.35); }
    100% { background: rgba(240,185,11,.13); }
  }
  .flash-new    { animation: flash-new 900ms ease-out; }
  .flash-grow   { animation: flash-grow 900ms ease-out; }
  .flash-shrink { animation: flash-shrink 600ms ease-out; }

  @keyframes price-up   { 0%{color:var(--green)} 50%{color:#7ef5b8} 100%{color:var(--green)} }
  @keyframes price-down { 0%{color:var(--red)}   50%{color:#ff8d9c} 100%{color:var(--green)} }
  .price.up   { animation: price-up .4s; }
  .price.down { animation: price-down .4s; }

  .empty{padding:10px;text-align:center;font-size:10px;color:var(--muted);font-style:italic}

  .status{font-size:10px;color:var(--muted);text-align:center;margin-top:6px}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:4px}
  .dot.off{background:var(--red)}
</style>
</head>
<body>

<div class="toast-wrap" id="toastWrap"></div>

<div class="wrap">
  <div class="header">
    <div>
      <div class="title">BTC/USDT</div>
      <div class="sub">LIVE Order Book · whales &gt; 3 BTC</div>
    </div>
    <div class="price" id="lastPrice">--</div>
  </div>

  <!-- TradingView 1D Chart -->
  <div class="tv-wrap">
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <div class="tradingview-widget-copyright">
        <a href="https://www.tradingview.com/symbols/BTCUSDT/?exchange=BINANCE" rel="noopener" target="_blank">BTCUSDT Chart</a> by TradingView
      </div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
      {
        "autosize": true,
        "symbol": "BINANCE:BTCUSDT",
        "interval": "D",
        "timezone": "Etc/UTC",
        "theme": "dark",
        "style": "1",
        "locale": "en",
        "backgroundColor": "rgba(22, 26, 30, 1)",
        "gridColor": "rgba(43, 49, 57, 0.5)",
        "hide_side_toolbar": true,
        "allow_symbol_change": false,
        "save_image": false,
        "calendar": false,
        "hide_volume": false,
        "support_host": "https://www.tradingview.com"
      }
      </script>
    </div>
  </div>

  <div class="panel">
    <div class="row head"><span>Price</span><span class="amt">BTC</span><span class="tot">USDT</span></div>
    <div id="asks"></div>
    <div class="mid" id="mid">Spread: --</div>
    <div id="bids"></div>
  </div>
  <div class="status"><span class="dot off" id="dot"></span><span id="status">Connecting…</span></div>
</div>

<script>
// ===== CONFIG =====
const MIN_BTC           = 3;
const MAX_LEVELS        = 10;     // ← MORE price rows per side (was 5)
const WS_DEPTH          = 'wss://stream.binance.com:9443/ws/btcusdt@depth20@100ms';
const SNAPSHOT_URL      = 'https://api.binance.com/api/v3/depth?symbol=BTCUSDT&limit=1000';
const SNAPSHOT_EVERY_MS = 2000;
const RENDER_THROTTLE   = 60;
const TOAST_LIFE_MS     = 3000;
const TOAST_MAX         = 3;
const TOAST_MIN_SIZE_BTC= 5;
const TOAST_COOLDOWN_MS = 4000;

// ===== DOM =====
const asksEl=document.getElementById('asks'), bidsEl=document.getElementById('bids');
const midEl=document.getElementById('mid'), priceEl=document.getElementById('lastPrice');
const statusEl=document.getElementById('status'), dotEl=document.getElementById('dot');
const toastWrap=document.getElementById('toastWrap');

const fmt=(n,d=2)=>Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const short=(n)=> n>=1e6?(n/1e6).toFixed(2)+'M' : n>=1e3?(n/1e3).toFixed(1)+'K' : fmt(n,2);

// ===== STATE =====
let liveBids = [], liveAsks = [];
let deepBids = [], deepAsks = [];
let needsPaint = false;
let lastPaint = 0;
let lastPrice = 0;

const lastSize = new Map();
const lastToastAt = new Map();

// ===== TOAST =====
function toast(side, price, qty, kind){
  const key = side+'|'+price;
  const now = Date.now();
  const last = lastToastAt.get(key) || 0;
  if(now - last < TOAST_COOLDOWN_MS) return;
  lastToastAt.set(key, now);

  const el = document.createElement('div');
  el.className = 'toast '+side;
  const isNew = kind === 'new';
  const icon = isNew ? '🐋' : '📈';
  const verb = isNew ? 'New wall' : 'Wall grew';
  const sideLabel = side === 'ask' ? 'ASK' : 'BID';
  el.innerHTML = `
    <span class="icon">${icon}</span>
    <span class="body">
      <div>${verb} · ${sideLabel}</div>
      <div><span class="p">$${fmt(price)}</span> · <span class="qty">${qty.toFixed(2)} BTC</span> <span class="s">(${short(price*qty)})</span></div>
    </span>`;
  toastWrap.appendChild(el);

  while(toastWrap.children.length > TOAST_MAX){
    toastWrap.removeChild(toastWrap.firstChild);
  }

  setTimeout(()=>{
    if(el.parentNode) el.parentNode.removeChild(el);
  }, TOAST_LIFE_MS);
}

// ===== ROW POOL =====
const ASK_POOL = [], BID_POOL = [];
function makeRow(parent){
  const row = document.createElement('div');
  row.className = 'row big';
  row.innerHTML = `<span class="bar"></span><span class="p"></span><span class="amt"></span><span class="tot"></span>`;
  parent.appendChild(row);
  return { el:row, bar:row.children[0], p:row.children[1], a:row.children[2], v:row.children[3] };
}
function ensurePool(pool, parent, n){
  while(pool.length < n) pool.push(makeRow(parent));
}

function flashRow(r, kind){
  r.el.classList.remove('flash-new','flash-grow','flash-shrink');
  void r.el.offsetWidth;
  r.el.classList.add(kind);
  clearTimeout(r.flashTimer);
  r.flashTimer = setTimeout(()=>{
    r.el.classList.remove('flash-new','flash-grow','flash-shrink');
  }, 950);
}

function paint(container, pool, data, side){
  ensurePool(pool, container, MAX_LEVELS);
  const ph = container.querySelector('.empty');

  if(!data.length){
    pool.forEach(r=>r.el.style.display='none');
    if(ph){ ph.textContent = `No ${side}s > ${MIN_BTC} BTC`; ph.style.display='block'; }
    else {
      const e=document.createElement('div'); e.className='empty';
      e.textContent=`No ${side}s > ${MIN_BTC} BTC`; container.appendChild(e);
    }
    for(const k of lastSize.keys()) if(k.startsWith(side)) lastSize.delete(k);
    return;
  }
  if(ph) ph.style.display='none';

  let maxV = 1;
  for(let i=0;i<data.length;i++) if(data[i].v>maxV) maxV=data[i].v;

  const seenKeys = new Set();

  for(let i=0;i<MAX_LEVELS;i++){
    const r = pool[i];
    if(i >= data.length){ r.el.style.display='none'; continue; }
    const x = data[i];
    r.el.style.display='grid';
    if(r.el.className.indexOf('row big '+side) < 0 || r.el.className.indexOf('flash-') === -1){
      const active = ['flash-new','flash-grow','flash-shrink'].find(c=>r.el.classList.contains(c));
      r.el.className = 'row big '+side + (active ? ' '+active : '');
    }

    const pct = (x.v/maxV)*100;
    r.bar.style.width = pct.toFixed(1)+'%';
    const pt = fmt(x.p), at = x.a.toFixed(3), vt = short(x.v);
    if(r.p.textContent !== pt) r.p.textContent = pt;
    if(r.a.textContent !== at) r.a.textContent = at;
    if(r.v.textContent !== vt) r.v.textContent = vt;

    const key = side + '|' + x.p;
    const prev = lastSize.get(key);
    if(prev === undefined){
      flashRow(r, 'flash-new');
      if(x.a >= TOAST_MIN_SIZE_BTC) toast(side, x.p, x.a, 'new');
    } else if(prev > 0){
      const delta = x.a - prev;
      if(delta > MIN_BTC * 0.1){
        flashRow(r, 'flash-grow');
        if(x.a >= TOAST_MIN_SIZE_BTC && delta >= TOAST_MIN_SIZE_BTC * 0.5){
          toast(side, x.p, x.a, 'grow');
        }
      } else if(delta < -MIN_BTC * 0.1){
        flashRow(r, 'flash-shrink');
      }
    }
    lastSize.set(key, x.a);
    seenKeys.add(key);
  }

  for(const k of lastSize.keys()){
    if(k.startsWith(side+'|') && !seenKeys.has(k)) lastSize.delete(k);
  }
}

// ===== WHALE FILTER =====
function pickWhales(levels, side, limit){
  const arr = [];
  for(let i=0;i<levels.length;i++){
    const [p,a] = levels[i];
    if(+a > MIN_BTC) arr.push({p:+p, a:+a, v:+p*+a});
  }
  arr.sort((x,y)=> side==='ask' ? x.p-y.p : y.p-x.p);
  if(arr.length>limit) arr.length = limit;
  return arr;
}

function combined(){
  let asks = pickWhales(liveAsks, 'ask', MAX_LEVELS);
  let bids = pickWhales(liveBids, 'bid', MAX_LEVELS);
  if(asks.length < MAX_LEVELS && deepAsks.length){
    const seen = new Set(asks.map(x=>x.p));
    const extra = pickWhales(deepAsks,'ask',MAX_LEVELS*6);
    for(const x of extra){ if(asks.length>=MAX_LEVELS) break; if(!seen.has(x.p)){ asks.push(x); seen.add(x.p); } }
    asks.sort((x,y)=>x.p-y.p);
  }
  if(bids.length < MAX_LEVELS && deepBids.length){
    const seen = new Set(bids.map(x=>x.p));
    const extra = pickWhales(deepBids,'bid',MAX_LEVELS*6);
    for(const x of extra){ if(bids.length>=MAX_LEVELS) break; if(!seen.has(x.p)){ bids.push(x); seen.add(x.p); } }
    bids.sort((x,y)=>y.p-x.p);
  }
  return {asks, bids};
}

function setPrice(bb){
  if(lastPrice === 0){ lastPrice = bb; priceEl.textContent='$'+fmt(bb); return; }
  if(bb === lastPrice) return;
  priceEl.classList.remove('up','down');
  void priceEl.offsetWidth;
  priceEl.classList.add(bb > lastPrice ? 'up' : 'down');
  lastPrice = bb;
  priceEl.textContent = '$'+fmt(bb);
}

function loop(ts){
  if(needsPaint && ts - lastPaint >= RENDER_THROTTLE){
    needsPaint = false;
    lastPaint = ts;
    const {asks, bids} = combined();
    paint(asksEl, ASK_POOL, asks.slice().reverse(), 'ask');
    paint(bidsEl, BID_POOL, bids, 'bid');
    if(liveBids.length && liveAsks.length){
      const bb=+liveBids[0][0], ba=+liveAsks[0][0];
      setPrice(bb);
      const sTxt='Spread: '+fmt(ba-bb);
      if(midEl.textContent!==sTxt) midEl.textContent=sTxt;
    }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function scheduleRender(){ needsPaint = true; }

async function loadDeepSnapshot(){
  try{
    const r = await fetch(SNAPSHOT_URL, {cache:'no-store'});
    if(!r.ok) return;
    const d = await r.json();
    if(d.asks && d.bids){ deepAsks = d.asks; deepBids = d.bids; scheduleRender(); }
  }catch(_){}
}

let ws, delay = 500;
function connect(){
  ws = new WebSocket(WS_DEPTH);
  ws.onopen = () => {
    delay = 500;
    statusEl.textContent = `LIVE · whales > ${MIN_BTC} BTC`;
    dotEl.className = 'dot';
    loadDeepSnapshot();
  };
  ws.onclose = () => {
    dotEl.className = 'dot off';
    statusEl.textContent = 'Reconnecting…';
    setTimeout(connect, delay);
    delay = Math.min(delay*1.5, 5000);
  };
  ws.onerror = () => { try{ ws.close(); }catch(_){} };
  ws.onmessage = e => {
    const d = JSON.parse(e.data);
    if(d.bids && d.asks){ liveBids = d.bids; liveAsks = d.asks; scheduleRender(); }
  };
}

loadDeepSnapshot();
connect();
setInterval(loadDeepSnapshot, SNAPSHOT_EVERY_MS);

document.addEventListener('visibilitychange', () => {
  if(document.hidden){
    try{ ws?.close(); }catch(_){}
  } else {
    lastSize.clear();
    lastToastAt.clear();
    loadDeepSnapshot();
    connect();
  }
});
</script>
</body>
</html>

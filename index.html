<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTC Orderbook — 10BTC+ Whales</title>
<style>
  :root{
    --bg:#0b0e11; --panel:#161a1e; --border:#2b3139;
    --green:#0ecb81; --red:#f6465d; --text:#eaecef; --muted:#848e9c;
    --whale:#f0b90b;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
  body{background:var(--bg);color:var(--text);display:flex;justify-content:center;padding:10px}
  .wrap{width:100%;max-width:460px}

  .header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .title{font-size:18px;font-weight:700}
  .price{font-size:20px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums}
  .sub{font-size:10px;color:var(--muted)}

  .ctx{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px}
  .ctx-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
  .ctx-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:11px}
  .ctx-item{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04)}
  .ctx-item .k{color:var(--muted)}
  .ctx-item .v{font-weight:600}
  .v.fear{color:var(--red)}
  .v.warn{color:var(--whale)}
  .ctx-note{font-size:9px;color:var(--muted);margin-top:8px;line-height:1.3;font-style:italic}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .row{display:grid;grid-template-columns:1.15fr 1fr .85fr;padding:5px 10px;font-size:11.5px;position:relative;align-items:center}
  .row.head{color:var(--muted);border-bottom:1px solid var(--border);font-size:9.5px;text-transform:uppercase}
  .row .bar{position:absolute;top:0;bottom:0;right:0;opacity:.13}
  .ask .bar{background:var(--red)}
  .bid .bar{background:var(--green)}
  .ask .p{color:var(--red)}
  .bid .p{color:var(--green)}
  .amt,.tot{text-align:right;font-variant-numeric:tabular-nums}
  .mid{padding:6px 10px;text-align:center;font-weight:700;font-size:13px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:#1e2329;font-variant-numeric:tabular-nums}

  .row.big{
    background:rgba(240,185,11,.13);
    border-left:3px solid var(--whale);
    padding-left:7px;
  }
  .row.big .p{font-weight:700;color:var(--whale)}
  .row.big .amt,.row.big .tot{color:var(--whale);font-weight:600}
  .row.big .bar{opacity:.30}

  .empty{padding:10px;text-align:center;font-size:10px;color:var(--muted);font-style:italic}

  .status{font-size:10px;color:var(--muted);text-align:center;margin-top:6px}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div>
      <div class="title">BTC/USDT</div>
      <div class="sub">Order Book · orders ≥ 10 BTC</div>
    </div>
    <div class="price" id="lastPrice">--</div>
  </div>

  <div class="ctx">
    <div class="ctx-title">📊 Market Context</div>
    <div class="ctx-grid">
      <div class="ctx-item"><span class="k">Fear &amp; Greed</span><span class="v fear" id="fng">6 · Extreme Fear</span></div>
      <div class="ctx-item"><span class="k">24h Change</span><span class="v" id="chg">--</span></div>
      <div class="ctx-item"><span class="k">200-day MA</span><span class="v warn" id="ma200">~$75,627</span></div>
      <div class="ctx-item"><span class="k">50-day MA</span><span class="v warn" id="ma50">~$76,612</span></div>
      <div class="ctx-item"><span class="k">Key Support</span><span class="v" id="sup">$55,251</span></div>
      <div class="ctx-item"><span class="k">Key Resistance</span><span class="v" id="res">$62,612</span></div>
    </div>
    <div class="ctx-note">Whale orders only (≥ 10 BTC). High-signal, low-noise. Watch $55K–$56K support zone.</div>
  </div>

  <div class="panel">
    <div class="row head"><span>Price</span><span class="amt">BTC</span><span class="tot">USDT</span></div>
    <div id="asks"></div>
    <div class="mid" id="mid">Spread: --</div>
    <div id="bids"></div>
  </div>
  <div class="status"><span class="dot"></span><span id="status">Connecting…</span></div>
</div>

<script>
// ===== CONFIG =====
const MIN_BTC           = 10;      // only show levels with >= this many BTC
const MAX_LEVELS        = 5;       // rows per side after filtering
const WS_DEPTH          = 'wss://stream.binance.com:9443/ws/btcusdt@depth20@100ms';
const SNAPSHOT_URL      = 'https://api.binance.com/api/v3/depth?symbol=BTCUSDT&limit=1000';
const SNAPSHOT_EVERY_MS = 3000;    // faster deep-book refresh
const RENDER_THROTTLE   = 80;      // ms between DOM writes (WS still runs at 100ms)

// ===== DOM =====
const asksEl=document.getElementById('asks'), bidsEl=document.getElementById('bids');
const midEl=document.getElementById('mid'), priceEl=document.getElementById('lastPrice');
const statusEl=document.getElementById('status');
const chgEl=document.getElementById('chg');

const fmt=(n,d=2)=>Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const short=(n)=> n>=1e6?(n/1e6).toFixed(2)+'M' : n>=1e3?(n/1e3).toFixed(1)+'K' : fmt(n,2);

// ===== STATE =====
let liveBids = [], liveAsks = [];
let deepBids = [], deepAsks = [];
let lastRender = 0;
let renderQueued = false;

// Row pool to avoid DOM create/destroy churn (fast updates)
const ASK_POOL = [], BID_POOL = [];
function getRow(pool, parent, i){
  if(!pool[i]){
    const row = document.createElement('div');
    row.className = 'row big';
    row.innerHTML = `<span class="bar"></span>
      <span class="p"></span><span class="amt"></span><span class="tot"></span>`;
    parent.appendChild(row);
    pool[i] = {
      el: row,
      bar: row.children[0],
      p:   row.children[1],
      a:   row.children[2],
      v:   row.children[3],
    };
  }
  return pool[i];
}
function hideExtra(pool, count){
  for(let i=count; i<pool.length; i++) pool[i].el.style.display='none';
}

function isWhale(a){ return +a >= MIN_BTC; }

function pickWhales(levels, side, limit){
  const arr = [];
  for(let i=0;i<levels.length;i++){
    const [p,a] = levels[i];
    if(+a >= MIN_BTC) arr.push({p:+p, a:+a, v:+p*+a});
  }
  arr.sort((x,y)=> side==='ask' ? x.p-y.p : y.p-x.p);
  return arr.slice(0, limit);
}

function combined(){
  const liveAskP = new Set(liveAsks.map(x=>x[0]));
  const liveBidP = new Set(liveBids.map(x=>x[0]));

  let asks = pickWhales(liveAsks, 'ask', MAX_LEVELS);
  let bids = pickWhales(liveBids, 'bid', MAX_LEVELS);

  if(asks.length < MAX_LEVELS){
    const extra = pickWhales(deepAsks,'ask',MAX_LEVELS*8)
      .filter(x=>!liveAskP.has(String(x.p)))
      .slice(0, MAX_LEVELS-asks.length);
    asks = asks.concat(extra);
  }
  if(bids.length < MAX_LEVELS){
    const extra = pickWhales(deepBids,'bid',MAX_LEVELS*8)
      .filter(x=>!liveBidP.has(String(x.p)))
      .slice(0, MAX_LEVELS-bids.length);
    bids = bids.concat(extra);
  }
  asks.sort((x,y)=>x.p-y.p);
  bids.sort((x,y)=>y.p-x.p);
  return {asks: asks.slice(0,MAX_LEVELS), bids: bids.slice(0,MAX_LEVELS)};
}

function paint(container, pool, data, side){
  if(!data.length){
    hideExtra(pool, 0);
    // ensure empty placeholder exists
    let ph = container.querySelector('.empty');
    if(!ph){
      ph = document.createElement('div');
      ph.className='empty';
      container.appendChild(ph);
    }
    ph.textContent = `No ${side}s ≥ ${MIN_BTC} BTC`;
    ph.style.display='block';
    return;
  }
  const ph = container.querySelector('.empty');
  if(ph) ph.style.display='none';

  const maxV = Math.max(...data.map(x=>x.v), 1);
  for(let i=0;i<data.length;i++){
    const x = data[i];
    const row = getRow(pool, container, i);
    row.el.style.display='grid';
    row.el.className = 'row big '+side;
    const pct = Math.min(100, (x.v/maxV)*100);
    row.bar.style.width = pct+'%';
    // Only rewrite text if value changed → avoids layout thrash
    if(row.p.textContent !== String(x.p.toFixed(2)))     row.p.textContent = fmt(x.p);
    if(row.a.textContent !== String(x.a.toFixed(3)))     row.a.textContent = x.a.toFixed(3);
    if(row.v.textContent !== short(x.v))                 row.v.textContent = short(x.v);
  }
  hideExtra(pool, data.length);
}

function refreshUI(){
  const {asks, bids} = combined();
  // asks reversed → lowest ask sits at the bottom (near mid)
  paint(asksEl, ASK_POOL, asks.slice().reverse(), 'ask');
  paint(bidsEl, BID_POOL, bids, 'bid');

  if(liveBids.length && liveAsks.length){
    const bb = +liveBids[0][0];
    const ba = +liveAsks[0][0];
    const spread = ba - bb;
    const pTxt = '$'+fmt(bb);
    const sTxt = `Spread: ${fmt(spread)}`;
    if(priceEl.textContent !== pTxt) priceEl.textContent = pTxt;
    if(midEl.textContent   !== sTxt) midEl.textContent   = sTxt;
  }
}

// Throttle DOM writes — WS still fires at 100ms, we repaint at most every 80ms
function scheduleRender(){
  const now = performance.now();
  const wait = Math.max(0, RENDER_THROTTLE - (now - lastRender));
  if(renderQueued) return;
  renderQueued = true;
  setTimeout(()=>{
    renderQueued = false;
    lastRender = performance.now();
    refreshUI();
  }, wait);
}

// ===== DEEP SNAPSHOT =====
async function loadDeepSnapshot(){
  try{
    const r = await fetch(SNAPSHOT_URL, {cache:'no-store'});
    const d = await r.json();
    deepAsks = d.asks || [];
    deepBids = d.bids || [];
    scheduleRender();
  }catch(_){}
}

// ===== LIVE DEPTH WS =====
let ws, delay = 1000;
function connect(){
  ws = new WebSocket(WS_DEPTH);
  ws.onopen = () => { delay = 1000; statusEl.textContent = `Live · whales ≥ ${MIN_BTC} BTC`; };
  ws.onclose = () => {
    statusEl.textContent = 'Reconnecting…';
    setTimeout(connect, delay);
    delay = Math.min(delay*1.5, 10000);
  };
  ws.onerror = () => { try{ ws.close(); }catch(_){} };
  ws.onmessage = e => {
    const d = JSON.parse(e.data);
    if(d.bids && d.asks){
      liveBids = d.bids;
      liveAsks = d.asks;
      scheduleRender();
    }
  };
}

// ===== TICKER =====
let ws2, delay2 = 1000;
function connectTicker(){
  ws2 = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@miniTicker');
  ws2.onopen = () => { delay2 = 1000; };
  ws2.onclose = () => { setTimeout(connectTicker, delay2); delay2 = Math.min(delay2*1.5, 10000); };
  ws2.onerror = () => { try{ ws2.close(); }catch(_){} };
  ws2.onmessage = e => {
    const d = JSON.parse(e.data);
    if(d.c && d.o){
      const chg = ((d.c - d.o) / d.o * 100);
      chgEl.textContent = (chg>=0?'+':'') + chg.toFixed(2) + '%';
      chgEl.style.color = chg>=0 ? 'var(--green)' : 'var(--red)';
    }
  };
}

// ===== BOOT =====
loadDeepSnapshot();
connect();
connectTicker();
setInterval(loadDeepSnapshot, SNAPSHOT_EVERY_MS);

// Pause when hidden
document.addEventListener('visibilitychange', () => {
  if(document.hidden){
    try{ ws?.close(); }catch(_){}
    try{ ws2?.close(); }catch(_){}
  } else {
    loadDeepSnapshot();
    connect();
    connectTicker();
  }
});
</script>
</body>
</html>
